name: Checks
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run api:generate && git diff --exit-code -- lib/generated/api.d.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://portfolio:ci-test-only@localhost:55432/portfolio_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - name: Start isolated PostgreSQL 18
        run: bash scripts/ci-postgres.sh portfolio_test
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: 1.26.8, cache-dependency-path: backend/go.sum }
      - run: go vet ./...
        working-directory: backend
      - run: go test -race -count=1 ./...
        working-directory: backend
      - name: Stop test database
        if: always()
        run: bash scripts/ci-postgres.sh stop
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://portfolio:ci-test-only@localhost:55432/portfolio_e2e_test
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_AUTH_URL: http://localhost:8080
      NEXT_PUBLIC_READ_ONLY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { persist-credentials: false }
      - name: Start isolated PostgreSQL 18
        run: bash scripts/ci-postgres.sh portfolio_e2e_test
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: 1.26.8, cache-dependency-path: backend/go.sum }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: bash scripts/ci-e2e.sh
      - name: Stop test database
        if: always()
        run: bash scripts/ci-postgres.sh stop
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
          retention-days: 7
