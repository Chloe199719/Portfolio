name: chloe-home
services:
  backend:
    image: ${BACKEND_IMAGE:-chloe-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      LISTEN_ADDR: :8080
      DATABASE_URL: postgresql://portfolio:${POSTGRES_PASSWORD:?Set a URL-safe database password}@db:5432/portfolio
      DATA_DIR: /data
      SITE_URL: https://${FRONTEND_HOST:?Set the Vercel custom hostname}
      FRONTEND_ORIGINS: https://${FRONTEND_HOST}
      API_URL: https://api.${DOMAIN:?Set the domain}
      ISSUER_URL: https://auth.${DOMAIN}
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      SMTP_ADDR: mail.${DOMAIN}:587
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    volumes:
      - backend_data:/data
    networks: [web, database, mail]
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test:
        [
          CMD,
          wget,
          -q,
          --spider,
          --header,
          "Host: api.${DOMAIN}",
          "http://127.0.0.1:8080/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql]
    networks: [database]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set the certificate contact email}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
      - caddy_config:/config
    networks: [web]
    restart: unless-stopped
  mail:
    image: ghcr.io/docker-mailserver/docker-mailserver:16.0.1
    hostname: mail.${DOMAIN}
    environment:
      SSL_TYPE: manual
      SSL_CERT_PATH: /srv/tls/mail.${DOMAIN}.crt
      SSL_KEY_PATH: /srv/tls/mail.${DOMAIN}.key
      ENABLE_RSPAMD: 1
      ENABLE_CLAMAV: 0
      ENABLE_FAIL2BAN: 0
      PERMIT_DOCKER: none
      SPOOF_PROTECTION: 1
      POSTMASTER_ADDRESS: postmaster@${DOMAIN}
    ports: ["25:25", "587:587", "993:993"]
    volumes:
      - mail_data:/var/mail
      - mail_state:/var/mail-state
      - mail_logs:/var/log/mail
      - ./data/mail-config:/tmp/docker-mailserver
      - ./data/caddy/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mail.${DOMAIN}:/srv/tls:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      mail:
        aliases: ["mail.${DOMAIN}"]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "ss --listening --tcp | grep -q ':smtp ' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
volumes:
  postgres:
  backend_data:
  caddy_config:
  mail_data:
  mail_state:
  mail_logs:
networks:
  web:
  mail:
  database:
    internal: true
